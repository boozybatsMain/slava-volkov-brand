<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found · Slava Volkov</title>
    <!-- Настоящая 404: без неё Cloudflare Pages отдаёт главную с кодом 200 на любой адрес (и на /wp-login.php),
         что сканеры безопасности считают подозрительным. Отдельная статичная страница, без сборки и без JS. -->
    <style>
      :root { --bg: #f2efe8; --fg: #121212; --sub: #5b5850; --accent: #b5520f; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #060811; --fg: #e6ecfa; --sub: #9aa6bf; --accent: #ff8a2a; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body { font: 18px/1.5 'Inter Tight', system-ui, sans-serif; display: grid; place-content: center; padding: 0 16px; text-align: center; }
      h1 { font-size: 48px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: var(--sub); margin: 0 0 24px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a href="/">Slava Volkov — home</a>
  </body>
</html>
