# Сайт на GitHub Pages: каждый пуш в main собирается и выкладывается на
# https://boozybatsmain.github.io/slava-volkov-brand/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# один деплой за раз; начатый не отменяем, чтобы сайт не остался полувыложенным
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run typecheck
      # сайт живёт в подпапке /slava-volkov-brand/; ассеты берут её из BASE_URL
      - run: npx vite build --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
