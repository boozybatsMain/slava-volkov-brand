<!-- @dsCard group="Depth" height=300 subtitle="тень точками и появление сеткой ¼ · ½ · ¾ · 1" -->
<div class="stage">
  <canvas id="c" width="460" height="140" role="img" aria-label="Плита с тенью из точек и пять шагов появления сеткой"></canvas>
</div>
<style>
  html, body { margin: 0; background: var(--surface); }
  .stage { padding: 10px 20px; }
  canvas { width: 920px; max-width: 100%; height: auto; image-rendering: pixelated; display: block; }
</style>
<script>
  (function () {
    var cs = getComputedStyle(document.documentElement);
    var col = function (n, d) { return (cs.getPropertyValue(n) || d).trim() || d; };
    var dot = col('--shadow-dot', '#a39789'), edge = col('--slab-edge', '#b0a596'), side = col('--slab-side', '#8a8178');
    var seam = col('--slab-seam', '#4a433c'), sky = col('--sky-700', '#56708e'), cloud = col('--cloud-300', '#c8ac9b');
    var c = document.getElementById('c'), g = c.getContext('2d');
    var B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    var on = function (x, y, d) { return (B[(y % 4) * 4 + (x % 4)] + 0.5) / 16 < d; };
    g.fillStyle = dot;
    var cx = 120, cy = 112, rx = 96, ry = 16;
    for (var y = 0; y < 140; y++) for (var x = 0; x < 240; x++) {
      var r = Math.pow((x - cx) / rx, 2) + Math.pow((y - cy) / ry, 2);
      if (r >= 1) continue;
      var d = 0.38 * Math.ceil((1 - r) * 4) / 4;
      if (on(x, y, d)) g.fillRect(x, y, 1, 1);
    }
    var slab = function (x, y, w, h, t, k) {
      for (var j = 0; j < h + t; j++) for (var i = 0; i < w + t; i++) {
        var face = i < w && j < h, rim = !face && i >= t && j >= t;
        if (!face && !rim) continue;
        if (!on(x + i, y + j, k)) continue;
        if (face) g.fillStyle = (i === 0 || j === 0 || i === w - 1 || j === h - 1) ? seam : (j < h * 0.55 ? sky : cloud);
        else g.fillStyle = i >= w ? side : edge;
        g.fillRect(x + i, y + j, 1, 1);
      }
    };
    slab(60, 22, 112, 62, 5, 1.01);
    var steps = [0.25, 0.5, 0.75, 1.01];
    for (var s = 0; s < steps.length; s++) slab(262 + s * 50, 46, 36, 26, 3, steps[s]);
  })();
</script>
